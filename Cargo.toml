# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "2"
members = ["core", "cli", "transport", "app/rust"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = ""
rust-version = "1.75"

# Build the whole workspace with overflow checks even in release: this is a
# security-sensitive codebase, a silent wrap is worse than a panic.
[profile.release]
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
# Ship without symbols and source paths. It is not a security control — the code
# is public — but a released binary has no reason to carry the author's home
# directory and every module name around with it.
strip = "symbols"
