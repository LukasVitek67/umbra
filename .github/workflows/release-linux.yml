# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the Linux release. It runs here rather than on the author's machine for
# a plain reason: the author has no Linux machine, and a Linux build produced by
# cross-compiling from Windows is not something anyone should install.
#
# The tarball this produces is attached to the GitHub release, and the Arch
# PKGBUILD in packaging/arch downloads exactly that file and checks it against
# the signed manifest.

name: Release (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 2.0.0'
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsqlite3-dev protobuf-compiler \
            libnotify-dev libayatana-appindicator3-dev
          # libnotify-dev: local_notifier refuses to configure without it.
          # libayatana-appindicator3-dev: tray_manager needs it for the tray
          # icon, which on Linux is the difference between the app having one
          # and silently having none.

      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Test before building
        run: cargo test --workspace

      - name: Build
        working-directory: app
        env:
          # Compiled into the binary so GIF search works without the user
          # setting anything up. Absent on forks, which then build without it
          # and fall back to a key the user supplies - not a build failure.
          NULLCHAT_TENOR_KEY: ${{ secrets.TENOR_KEY }}
        run: |
          flutter pub get
          flutter build linux --release

      - name: Assemble the tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "${{ inputs.version }}" ] && VERSION="${{ inputs.version }}"
          NAME="NullChat-$VERSION-linux-x86_64"

          mkdir -p "dist/$NAME"
          cp -r app/build/linux/x64/release/bundle/* "dist/$NAME/"
          # Flutter names the binary after the project; the packaging expects
          # `nullchat`, and so does the .desktop entry.
          if [ -f "dist/$NAME/app" ]; then mv "dist/$NAME/app" "dist/$NAME/nullchat"; fi
          cp packaging/linux/nullchat.desktop "dist/$NAME/"
          cp -r packaging/linux/icons "dist/$NAME/icons"
          cp LICENSE README.md "dist/$NAME/"

          # No Tor binary is bundled: on Arch (and every other distro) tor is a
          # package, kept current by the system, which is better than shipping a
          # copy that ages in our tarball.
          cat > "dist/$NAME/README-linux.txt" <<'EOF'
          NullChat needs Tor. Install your distribution's package:

            Arch     sudo pacman -S tor
            Debian   sudo apt install tor
            Fedora   sudo dnf install tor

          NullChat starts its own tor process using that binary and keeps its
          data under ~/.local/share/nullchat.
          EOF

          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          sha256sum "dist/$NAME.tar.gz" | tee "dist/$NAME.tar.gz.sha256"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz*

      # Attaching happens only for a real tag; a manual run just leaves the
      # artifact to download, so it can be tested without touching a release.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/${NAME}.tar.gz dist/${NAME}.tar.gz.sha256 --clobber
