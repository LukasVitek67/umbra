[package]
name = "nullchat-transport"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tor onion transport for NullChat: drives the bundled tor daemon, hosts an onion service and dials peers through SOCKS5 — works through NAT, no server."

[dependencies]
nullchat-core = { path = "../core" }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "net",
    "time",
    "sync",
] }
anyhow = "1"

# Note: we deliberately drive the official C-Tor daemon (bundled `tor.exe`)
# rather than linking Arti. Arti 0.44 deadlocked during bootstrap on Windows
# (scheduled timers stopped firing, no consensus), while C-Tor bootstraps
# reliably through the same bridges. This is also what Briar and OnionShare do.

[[bin]]
name = "nullchat-tor-probe"
path = "src/main.rs"

[[bin]]
name = "nullchat-peer"
path = "src/bin/nullchat-peer.rs"
