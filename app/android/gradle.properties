# -Djava.net.preferIPv4Stack: Gradle talks to its own worker processes over
# loopback; with IPv6 first that connection fails on this setup
# ("Unable to establish loopback connection") before the build even starts.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
