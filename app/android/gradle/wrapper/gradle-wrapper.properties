distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Gradle 8, not 9: cargokit (the glue from flutter_rust_bridge that compiles the
# Rust core for Android) still calls Project.exec(), which Gradle 9 removed.
# Raising this without updating cargokit breaks the Rust build.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-all.zip
